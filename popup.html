<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Auto-Saver</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #d0d7de;
      border-radius: 20px;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .switch input:checked + .slider {
      background: #1a7f37;
    }

    .switch input:checked + .slider::before {
      transform: translateX(16px);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2328;
      font-size: 12px;
    }

    .search-input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.15);
    }

    .toolbar button {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2328;
      font-size: 12px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #f3f4f6;
    }

    #drafts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }

    .draft {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
    }

    .draft-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .source-label {
      font-size: 11px;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-icon {
      flex-shrink: 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      font-size: 14px;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
    }

    .copy-icon:hover {
      background: #f3f4f6;
    }

    .copy-icon.copied {
      background: #e6f4ea;
      border-color: #34a853;
    }

    .draft-text {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 16px 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      background: rgba(31, 35, 40, 0.9);
      color: #ffffff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Recovered Drafts</h1>

  <div class="toggle-row">
    <span>Enable Auto-Saver on this site</span>
    <label class="switch">
      <input type="checkbox" id="site-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="toolbar">
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Search drafts…"
      autocomplete="off"
    />
    <button id="export-btn" type="button">Export Drafts</button>
  </div>

  <!-- Container that holds the rendered recovered drafts -->
  <div id="drafts-container"></div>

  <!-- Brief visual notification shown after copying -->
  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
