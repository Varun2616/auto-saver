<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Auto-Saver</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    #drafts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }

    .draft {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
    }

    .draft-text {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2328;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #f3f4f6;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <h1>Recovered Drafts</h1>
  <!-- Container that holds the rendered recovered drafts -->
  <div id="drafts-container"></div>

  <script src="popup.js"></script>
</body>
</html>
